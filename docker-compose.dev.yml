# 本地开发编排：后端源码挂载进 Maven 镜像运行，无需本机安装 JDK。
#
# 启动（只含 MySQL + 后端；前端在宿主机 npm run dev）：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# 停止：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml down
#
# 改动 Java 代码后重建并重启后端（会重新编译）：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --force-recreate backend
#
# 需要连前端交付镜像一起跑时加 profile：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile full up -d --build
#
# 注意：这是开发用编排，不是交付镜像；生产镜像见 backend/Dockerfile、frontend/Dockerfile。

services:
  backend:
    # 覆盖 base 的 build，避免 dev 组合去构建生产镜像
    build: !reset null
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    command: ["mvn", "-B", "spring-boot:run"]
    restart: "no"
    ports: !override
      - "${BACKEND_PORT:-8080}:8080"
    volumes: !override
      # 源码热挂载；target/ 留在宿主机（已被 .gitignore 忽略）
      - ./backend:/workspace
      # Maven 依赖缓存，避免每次重建都重新下载
      - maven-cache:/root/.m2
      # 与交付编排一致的数据卷：素材与结果
      - app-data:/data

  frontend:
    # 默认不启动，保持“后端容器 + 宿主机前端”的开发方式
    profiles: ["full"]

volumes:
  maven-cache: