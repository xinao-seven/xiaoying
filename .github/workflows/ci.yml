name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # 构建期不请求后端；显式给出占位值，避免误用开发机地址
          BACKEND_URL: http://127.0.0.1:8080

  backend:
    name: backend (unit + web tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Make wrapper executable
        run: chmod +x mvnw
      - run: ./mvnw -B verify

  migration-smoke:
    name: migration-smoke (MySQL + Flyway + seed/claim SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xiaoying
          MYSQL_USER: xiaoying
          MYSQL_PASSWORD: xiaoying
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Apply migrations
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B org.flywaydb:flyway-maven-plugin:migrate \
            -Ddb.url='jdbc:mysql://127.0.0.1:3306/xiaoying?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC' \
            -Ddb.user=xiaoying \
            -Ddb.password=xiaoying
      - name: Validate migrations are repeatable
        working-directory: backend
        run: |
          ./mvnw -B org.flywaydb:flyway-maven-plugin:validate \
            -Ddb.url='jdbc:mysql://127.0.0.1:3306/xiaoying?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC' \
            -Ddb.user=xiaoying \
            -Ddb.password=xiaoying
      - name: Seed + claim SQL smoke
        run: |
          docker run --rm --network host \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_USER=xiaoying \
            -e DB_PASSWORD=xiaoying \
            -e DB_NAME=xiaoying \
            -v "$PWD/scripts/ci:/scripts:ro" \
            mysql:8.4 \
            bash /scripts/migration-smoke.sh