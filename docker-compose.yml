services:
  mysql:
    image: mysql:8.4
    container_name: xiaoying-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiaoying}
      MYSQL_USER: ${MYSQL_USER:-xiaoying}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xiaoying}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 宿主机默认 13306，避免与本机其他 MySQL 的 3306 冲突；容器内服务始终用 mysql:3306
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql-data: