services:
  mysql:
    image: mysql:8.4
    container_name: xiaoying-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiaoying}
      MYSQL_USER: ${MYSQL_USER:-xiaoying}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xiaoying}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 宿主机默认 13306，避免与本机其他 MySQL 的 3306 冲突；容器内服务始终用 mysql:3306
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
    image: xiaoying-backend:local
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-xiaoying}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-xiaoying}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-xiaoying}
      APP_DATA_DIR: /data
      APP_PIPELINE_CONCURRENCY: ${APP_PIPELINE_CONCURRENCY:-1}
      APP_SIMULATION_DEV_API_ENABLED: ${APP_SIMULATION_DEV_API_ENABLED:-true}
      APP_UPLOAD_MAX_BYTES: ${APP_UPLOAD_MAX_BYTES:-10485760}
      APP_UPLOAD_MAX_REQUEST_SIZE: ${APP_UPLOAD_MAX_REQUEST_SIZE:-11MB}
      TZ: UTC
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # 上传素材与结果文件；与 mysql-data 分开，重建数据库不会丢文件
      - app-data:/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    image: xiaoying-frontend:local
    restart: unless-stopped
    environment:
      # 浏览器只访问前端；代理在容器网络内访问 Java 后端
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
  app-data: