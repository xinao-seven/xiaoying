server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: xiaoying-backend
  datasource:
    url: '${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/xiaoying?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}'
    username: ${SPRING_DATASOURCE_USERNAME:xiaoying}
    password: ${SPRING_DATASOURCE_PASSWORD:xiaoying}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  data-dir: ${APP_DATA_DIR:./data}
  upload:
    max-bytes: 10485760
  pipeline:
    concurrency: ${APP_PIPELINE_CONCURRENCY:1}
    poll-interval-ms: ${APP_PIPELINE_POLL_INTERVAL_MS:1000}
  session:
    ttl-days: 7
  simulation:
    dev-api-enabled: ${APP_SIMULATION_DEV_API_ENABLED:false}
    delays:
      material-check-ms: 800
      generating-ms: 2500
      assembling-ms: 800

logging:
  level:
    com.xiaoying: INFO